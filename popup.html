<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>IG Unfollower Tracker</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body> 
    <div class="container">
        <h2>IG Unfollower Tracker</h2>
        <p class="subtitle">Takipçi Analiz Aracı</p>
        
        <button id="startBtn">Analizi Başlat</button>
       
        <div id="status" class="status-box">Takipçi Analiz Aracı Hazır</div>
        <div class="progress-bar">
            <div id="progress" class="progress-fill"></div>
        </div>
       
        <div id="results" class="results-box">
            <ul id="unfollowerList"></ul>
        </div>

        <!-- Otomatik Güncelleme Bildirim Kutusu -->
        <div id="updateNotice" style="display: none; background-color: #1e293b; border: 1px solid #38bdf8; border-radius: 6px; padding: 10px; text-align: center; margin-top: 5px;">
            <span id="updateText" style="font-size: 12px; color: #38bdf8; font-weight: bold; display: block; margin-bottom: 6px;">🚀 Yeni Güncelleme Mevcut!</span>
            <button id="updateBtn" style="background-color: #22c55e; width: 100%; padding: 6px; font-size: 12px;">Güncellemeyi İndir (.zip)</button>
        </div>

        <footer>
            <span>Designed & Developed by <strong>Berat Ali KARADAŞ</strong></span>
        </footer>
    </div>

    <script src="popup.js"></script>
  </body>
  </html>
